  <text x="64" y="66" fill="#52647a" font-size="18" font-weight="700" font-family="Noto Sans, DejaVu Sans, sans-serif" text-anchor="start">EL ESPEJO  /  BACKEND</text>
  <text x="64" y="121" fill="#172b44" font-size="42" font-weight="700" font-family="Noto Sans, DejaVu Sans, sans-serif" text-anchor="start">Arquitectura hexagonal</text>
  <text x="1390" y="116" fill="#52647a" font-size="18" font-weight="400" font-family="Noto Sans, DejaVu Sans, sans-serif" text-anchor="start">ORGANIZACIÓN OBJETIVO</text>
