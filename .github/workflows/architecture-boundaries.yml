name: Architecture boundaries

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check current and new import boundaries
        run: python scripts/check_architecture.py
      - name: Install checker test dependency
        run: python -m pip install 'pytest>=8.3,<9'
      - name: Verify boundary enforcement without application dependencies
        run: python -m pytest tests/test_architecture_boundaries.py
