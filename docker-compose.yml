services:
  api:
    build:
      context: .
    env_file:
      - .env.local
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      NEO4J_URI: bolt://neo4j:7687
      DOCUMENTS_PATH: /data/documents
      EXTRACTIONS_PATH: /data/extractions
    volumes:
      - core_documents:/data/documents
      - core_extractions:/data/extractions
      - ./src:/app/src
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 30s
      retries: 10
    depends_on:
      neo4j:
        condition: service_healthy

  pwa:
    build:
      context: ../mirror-pwa
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - ../mirror-pwa/.env
    volumes:
      - ../mirror-pwa:/app
      - pwa_node_modules:/app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      pwa:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Tunnel token is required}

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-el-espejo-local-password}
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
  pwa_node_modules:
  core_documents:
  core_extractions: