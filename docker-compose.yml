services:
  api:
    build:
      context: .
    env_file:
      - .env.local
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # Temporary compatibility variables until ArcadeDBGraphStore replaces Neo4jGraphStore.
      NEO4J_URI: bolt://arcadedb:7687
      NEO4J_USERNAME: root
      NEO4J_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:-el-espejo-local-password}
      DOCUMENTS_PATH: /data/documents
      EXTRACTIONS_PATH: /data/extractions
    volumes:
      - core_data:/data
      - ./src:/app/src
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 30s
      retries: 10
    depends_on:
      arcadedb:
        condition: service_healthy
      arcadedb-schema:
        condition: service_completed_successfully

  arcadedb-schema:
    build:
      context: .
    env_file:
      - .env.local
    command: python -m src.graph.arcadedb.schema
    environment:
      ARCADEDB_HTTP_URL: http://arcadedb:2480
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE:-el_espejo}
      ARCADEDB_USERNAME: root
      ARCADEDB_ROOT_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:-el-espejo-local-password}
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: "no"

  pwa:
    build:
      context: ../mirror-pwa
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - ../mirror-pwa/.env
    volumes:
      - ../mirror-pwa:/app
      - pwa_node_modules:/app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      pwa:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Tunnel token is required}

  arcadedb:
    image: arcadedata/arcadedb:26.9.1
    hostname: arcadedb
    environment:
      ARCADEDB_SETTINGS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD:-el-espejo-local-password}
        -Darcadedb.server.defaultDatabases=${ARCADEDB_DATABASE:-el_espejo}[]
        -Darcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin
        -Darcadedb.bolt.defaultDatabase=${ARCADEDB_DATABASE:-el_espejo}
    ports:
      - "${ARCADEDB_BOLT_PORT:-7687}:7687"
      - "${ARCADEDB_HTTP_PORT:-2480}:2480"
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:2480/api/v1/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  arcadedb_data:
  pwa_node_modules:
  core_data:
