name: Publish production image

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: production-image-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate Docker Hub configuration
        run: |
          test -n "${{ vars.DOCKERHUB_IMAGE }}"
          test -n "${{ secrets.DOCKERHUB_USERNAME }}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Create release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          release_date="$(date -u +'%Y.%m.%d')"
          last_sequence="$(git tag -l "${release_date}-[0-9][0-9][0-9]" | sed "s/^${release_date}-//" | sort -n | tail -n 1)"
          if [ -n "$last_sequence" ]; then
            next_sequence=$((10#$last_sequence + 1))
          else
            next_sequence=1
          fi
          if [ "$next_sequence" -gt 999 ]; then
            echo "More than 999 production releases were requested for ${release_date}." >&2
            exit 1
          fi
          version="$(printf '%s-%03d' "$release_date" "$next_sequence")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create Git release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$VERSION" "$MERGE_SHA" --message "Production release $VERSION"
          git push origin "refs/tags/$VERSION"
