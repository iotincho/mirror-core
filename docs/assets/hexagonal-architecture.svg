<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura hexagonal de El Espejo</title>
  <desc id="description">Acceso invoca casos de uso dentro del hexágono. Core contiene reglas y puertos. Los adaptadores de salida implementan esos puertos. Bootstrap conecta los componentes. La franja inferior distingue las dependencias de código.</desc>
