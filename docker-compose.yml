x-processing: &processing
  build:
    context: .
  env_file:
    - .env.local
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-el_espejo}:${POSTGRES_PASSWORD:-el-espejo-local-password}@postgres:5432/${POSTGRES_DB:-el_espejo}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-processing}:${RABBITMQ_PASSWORD:-processing-local-password}@rabbitmq:5672/
    PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY:-4}
    ARCADEDB_HTTP_URL: http://arcadedb:2480
    ARCADEDB_USERNAME: root
    ARCADEDB_ROOT_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:-el-espejo-local-password}
    WORKSPACES_PATH: /data/users
    DOCUMENTS_PATH: /data/documents
    AUDIO_NOTES_PATH: /data/audio-notes
    EXTRACTIONS_PATH: /data/extractions
    REFLECTIONS_PATH: /data/reflections
  volumes:
    - core_data:/data
    - ./src:/app/src
  depends_on:
    rabbitmq:
      condition: service_healthy
    database-migrations:
      condition: service_completed_successfully
    data-migrations:
      condition: service_completed_successfully
    arcadedb:
      condition: service_healthy
    arcadedb-schema:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 45s


services:
  api:
    build:
      context: .
    env_file:
      - .env.local
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-el_espejo}:${POSTGRES_PASSWORD:-el-espejo-local-password}@postgres:5432/${POSTGRES_DB:-el_espejo}
      ARCADEDB_HTTP_URL: http://arcadedb:2480
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE:-el_espejo}
      ARCADEDB_USERNAME: root
      ARCADEDB_ROOT_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:-el-espejo-local-password}
      DOCUMENTS_PATH: /data/documents
      EXTRACTIONS_PATH: /data/extractions
      WORKSPACES_PATH: /data/users
    volumes:
      - core_data:/data
      - ./src:/app/src
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 60s
      timeout: 30s
      retries: 10
    depends_on:
      arcadedb:
        condition: service_healthy
      arcadedb-schema:
        condition: service_completed_successfully
      database-migrations:
        condition: service_completed_successfully
      data-migrations:
        condition: service_completed_successfully

  database-migrations:
    build:
      context: .
    env_file:
      - .env.local
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-el_espejo}:${POSTGRES_PASSWORD:-el-espejo-local-password}@postgres:5432/${POSTGRES_DB:-el_espejo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  data-migrations:
    <<: *processing
    restart: "no"
    command: python -m src.maintenance.data_migrations --apply --services-stopped
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      arcadedb-schema:
        condition: service_completed_successfully
      arcadedb:
        condition: service_healthy

  arcadedb-schema:
    build:
      context: .
    env_file:
      - .env.local
    command: python -m src.graph.arcadedb.schema
    environment:
      ARCADEDB_HTTP_URL: http://arcadedb:2480
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE:-el_espejo}
      ARCADEDB_USERNAME: root
      ARCADEDB_ROOT_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:-el-espejo-local-password}
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: "no"

  pwa:
    build:
      context: ../mirror-pwa
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - ../mirror-pwa/.env
    volumes:
      - ../mirror-pwa:/app
      - pwa_node_modules:/app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      pwa:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Tunnel token is required}

  arcadedb:
    image: arcadedata/arcadedb:26.9.1
    hostname: arcadedb
    environment:
      ARCADEDB_SETTINGS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD:-el-espejo-local-password}
        -Darcadedb.server.defaultDatabases=${ARCADEDB_DATABASE:-el_espejo}[]
    ports:
      - "${ARCADEDB_HTTP_PORT:-2480}:2480"
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:2480/api/v1/ready"]
      interval: 60s
      timeout: 5s
      retries: 20
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-el_espejo}
      POSTGRES_USER: ${POSTGRES_USER:-el_espejo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-el-espejo-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-el_espejo} -d ${POSTGRES_DB:-el_espejo}"]
      interval: 60s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-processing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-processing-local-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  processing-worker:
    <<: *processing
    command: >-
      taskiq worker src.processing.broker:broker src.processing.tasks
      --workers 1 --max-async-tasks ${PROCESSING_CONCURRENCY:-4}
      --max-prefetch 0 --ack-type manual

  processing-dispatcher:
    <<: *processing
    command: python -m src.processing.dispatcher

volumes:
  arcadedb_data:
  pwa_node_modules:
  core_data:
  postgres_data:
  rabbitmq_data:
